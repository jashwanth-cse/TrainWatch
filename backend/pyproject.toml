[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trainwatch"
version = "0.0.1"
description = "Credential-free Phase 0 backend baseline for TrainWatch"
readme = { text = "TrainWatch backend package. See the repository README for setup and safety boundaries.", content-type = "text/markdown" }
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.159.1",
    "firebase-admin>=7.0.0",
    "google-cloud-firestore==2.21.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trainwatch"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "../scripts"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=trainwatch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["trainwatch"]

[tool.coverage.report]
show_missing = true
skip_covered = false
