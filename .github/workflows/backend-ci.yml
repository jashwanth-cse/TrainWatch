name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"

      - name: Scan repository for common secret patterns
        run: python scripts/check_secrets.py

      - name: Install backend and development tools
        working-directory: backend
        run: uv sync --extra dev --locked

      - name: Check formatting
        working-directory: backend
        run: uv run --no-sync ruff format --check . ../scripts

      - name: Lint
        working-directory: backend
        run: uv run --no-sync ruff check . ../scripts

      - name: Type check
        working-directory: backend
        run: uv run --no-sync mypy src tests ../scripts

      - name: Test
        working-directory: backend
        run: uv run --no-sync pytest
