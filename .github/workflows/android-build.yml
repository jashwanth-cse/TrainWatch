name: Android APK Build (EAS Local)

on:
  workflow_dispatch:
  push:
    branches:
      - build

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with npm caching for the mobile workspace
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Step 3: Set up Java JDK 17 (Temurin)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Cache Gradle caches and wrapper to speed up subsequent builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 5: Install dependencies using package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # Step 6: Install EAS CLI globally
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Step 6.5: Configure google-services.json for Firebase FCM
      - name: Setup google-services.json
        working-directory: mobile
        env:
          GOOGLE_SERVICES_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_RAW" ]; then
            echo "::error::GOOGLE_SERVICES_JSON repository secret is missing. FCM notifications require google-services.json."
            exit 1
          fi
          if echo "$GOOGLE_SERVICES_RAW" | base64 -d >/dev/null 2>&1 && [[ "$GOOGLE_SERVICES_RAW" != *"{"* ]]; then
            echo "$GOOGLE_SERVICES_RAW" | base64 -d > google-services.json
          else
            echo "$GOOGLE_SERVICES_RAW" > google-services.json
          fi
          echo "Successfully configured google-services.json from GOOGLE_SERVICES_JSON secret."

      # Step 6.6: Extract App Version from mobile/app.json
      - name: Extract App Version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Target Release Version: v$VERSION"

      # Step 7: Build Android APK locally using EAS CLI
      # EAS CLI automatically fetches remote credentials using EXPO_TOKEN
      - name: Build Android APK with EAS local
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/build"
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/build/TrainWatch-${{ env.APP_VERSION }}.apk"

      # Step 8: Upload build artifact to GitHub Actions run
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ github.workspace }}/build/TrainWatch-${{ env.APP_VERSION }}.apk
          retention-days: 14

      # Step 9: Automatically publish GitHub Release with the APK asset
      # Uses the built-in GITHUB_TOKEN with contents:write permission
      - name: Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: TrainWatch ${{ env.APP_VERSION }}
          files: |
            ${{ github.workspace }}/build/TrainWatch-${{ env.APP_VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Step 3 Optional Cloudflare R2 Upload (Commented out; enable as needed)
      # =========================================================================
      # - name: Upload APK to Cloudflare R2
      #   if: success()
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: auto
      #   run: |
      #     aws s3 cp "${{ github.workspace }}/build/TrainWatch-${{ env.APP_VERSION }}.apk" \
      #       "s3://${{ secrets.R2_BUCKET }}/builds/TrainWatch-${{ env.APP_VERSION }}.apk" \
      #       --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
